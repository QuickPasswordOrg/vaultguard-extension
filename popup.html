<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultGuard</title>
  <link rel="stylesheet" href="src/popup/popup.css" />
</head>
<body>
<div id="app">

  <!-- ── Auth view ─────────────────────────────────── -->
  <div id="view-auth" class="view">
    <div class="header">
      <div class="logo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand">VaultGuard</span>
      <div class="header-actions">
        <button id="btn-theme-auth" class="icon-btn theme-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-body">
      <div class="auth-hero">
        <div class="auth-shield">
          <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <h2 class="auth-heading">Unlock Your Vault</h2>
        <p class="auth-sub">Enter your master password to continue</p>
      </div>

      <div id="auth-error" class="error-msg hidden">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Incorrect password. Please try again.
      </div>

      <div class="input-wrap">
        <input type="password" id="master-password" placeholder="Master password" class="input" autocomplete="current-password" autofocus />
        <button id="btn-eye" class="eye-btn" aria-label="Toggle password visibility" tabindex="-1">
          <svg class="eye-open" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="eye-closed hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
        </button>
      </div>

      <button id="btn-unlock" class="btn-primary">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Unlock Vault
      </button>

      <div class="auth-divider"><span>or</span></div>
      <a href="http://localhost:3000/auth/login" target="_blank" class="link-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Sign in to full app
      </a>
    </div>
  </div>

  <!-- ── Vault view ─────────────────────────────────── -->
  <div id="view-vault" class="view hidden">
    <div class="header">
      <div class="logo">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand">VaultGuard</span>
      <div class="header-actions">
        <button id="btn-theme" class="icon-btn theme-btn" title="Toggle theme" aria-label="Toggle theme">
          <svg class="icon-moon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
          <svg class="icon-sun hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
        <button id="btn-lock" class="icon-btn" title="Lock vault" aria-label="Lock vault">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
      </div>
    </div>

    <!-- Site matches -->
    <div id="site-matches" class="section-block hidden">
      <p class="section-label">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        SUGGESTED FOR THIS SITE
      </p>
      <div id="matches-list"></div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <svg class="search-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="search-input" placeholder="Search vault…" class="search-input" autocomplete="off" />
      <button id="btn-search-clear" class="search-clear hidden" aria-label="Clear search">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Items -->
    <div class="items-scroll">
      <div class="section-block">
        <p class="section-label">ALL ITEMS <span id="items-count" class="count-badge"></span></p>
        <div id="items-list"></div>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="btn-generator" class="footer-btn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        Generator
      </button>
      <button id="btn-open-app" class="footer-btn footer-btn-accent">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        Open App
      </button>
    </div>
  </div>

  <!-- ── Generator view ────────────────────────────── -->
  <div id="view-generator" class="view hidden">
    <div class="header">
      <button id="btn-back" class="icon-btn" aria-label="Back to vault">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <span class="brand">Password Generator</span>
    </div>
    <div class="gen-body">
      <div class="gen-output">
        <span id="gen-password" class="gen-pw">Click Generate</span>
        <div class="gen-actions">
          <button id="btn-copy-gen" class="icon-btn" title="Copy password" aria-label="Copy password">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          </button>
          <button id="btn-refresh" class="icon-btn" title="Regenerate" aria-label="Regenerate password">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          </button>
        </div>
      </div>

      <div class="strength-section">
        <div class="strength-bar-track">
          <div id="gen-strength-bar" class="strength-bar-fill"></div>
        </div>
        <span id="gen-strength-label" class="strength-label">—</span>
      </div>

      <div class="slider-row">
        <div class="slider-label-row">
          <label>Length</label>
          <span id="len-display" class="len-badge">20</span>
        </div>
        <input type="range" id="gen-length" min="8" max="64" value="20" class="slider" />
      </div>

      <div class="options">
        <label class="checkbox-row"><input type="checkbox" id="opt-upper" checked /> Uppercase (A–Z)</label>
        <label class="checkbox-row"><input type="checkbox" id="opt-lower" checked /> Lowercase (a–z)</label>
        <label class="checkbox-row"><input type="checkbox" id="opt-nums"  checked /> Numbers (0–9)</label>
        <label class="checkbox-row"><input type="checkbox" id="opt-syms"  checked /> Symbols (!@#…)</label>
      </div>

      <button id="btn-generate" class="btn-primary">Generate Password</button>
      <button id="btn-fill" class="btn-secondary">Fill Into Page</button>
    </div>
  </div>

</div>
<script src="src/popup/popup.js"></script>
</body>
</html>
